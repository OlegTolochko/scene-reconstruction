[project]
name = "scene-reconstruction"
version = "0.1.0"
description = "Research project on scene reconstruction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ScanNet++ download (scripts/)
    "munch",
    "pyyaml",
    "tqdm",
    # ScanNet++ evaluation (scripts/evaluate_scannetpp.py)
    "numpy",
    "open3d",
    "pillow",
    "scipy",
    "trimesh",
    "pycolmap>=4.2.1",
]

# Installs evaluation/ into the root env, so scripts and experiments can import it from anywhere.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]
